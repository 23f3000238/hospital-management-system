{% extends 'base.html' %}
{% block content %}
  <h2>Edit Availability</h2>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Days</label>
      <div class="form-check">
        {% for d in ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] %}
          <input class="form-check-input" type="checkbox" name="days" value="{{ d }}" id="d{{ d }}" {% if d in (doctor.availability_days or '').split(',') %}checked{% endif %}>
          <label class="form-check-label me-2" for="d{{ d }}">{{ d }}</label>
        {% endfor %}
      </div>
    </div>
    <div class="row">
      <div class="col-md-3 mb-3">
        <label class="form-label">From</label>
        <input type="time" name="available_from" class="form-control" value="{{ doctor.available_from }}">
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label">To</label>
        <input type="time" name="available_to" class="form-control" value="{{ doctor.available_to }}">
      </div>
    </div>
    <button class="btn btn-primary">Save Availability</button>
  </form>
{% endblock %}
